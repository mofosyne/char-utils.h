name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Run tests
        run: |
          make test CC=${{ matrix.compiler }}
